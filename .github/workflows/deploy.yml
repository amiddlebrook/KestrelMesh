name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require deployment credentials
        env:
          APP_ADMIN_TOKEN: ${{ secrets.APP_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$APP_ADMIN_TOKEN" || { echo 'Missing APP_ADMIN_TOKEN'; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate committed dependency graph and all D1 migrations
        run: npm run verify:release
      - name: Check TypeScript and frontend
        run: npm run check
      - name: Test application contracts
        run: npm test
      - name: Rehearse a clean database restore with synthetic application data
        run: npm run verify:recovery
      - name: Provision and migrate D1
        run: bash scripts/bootstrap-d1.sh
      - name: Deploy Cloudflare Worker and assets
        run: npx wrangler deploy
      - name: Install protected admin secret
        env:
          APP_ADMIN_TOKEN: ${{ secrets.APP_ADMIN_TOKEN }}
        run: printf '%s' "$APP_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: Verify live deployment contract
        env:
          DEPLOY_URL: https://portfolio-kestrelmesh.averymiddlebrook2014.workers.dev
          APP_ADMIN_TOKEN: ${{ secrets.APP_ADMIN_TOKEN }}
        run: npm run verify:live
      - name: Measure a bounded production health latency sample (24 read-only requests)
        env:
          DEPLOY_URL: https://portfolio-kestrelmesh.averymiddlebrook2014.workers.dev
        run: npm run verify:edge
      - name: Verify actual browser UX on deployed Cloudflare Worker
        env:
          DEPLOY_URL: https://portfolio-kestrelmesh.averymiddlebrook2014.workers.dev
          APP_ADMIN_TOKEN: ${{ secrets.APP_ADMIN_TOKEN }}
          APP_NAME: KestrelMesh
          APP_PRIMARY_SECTION: routinglab
          CHROME_BIN: google-chrome
        run: |
          command -v google-chrome
          google-chrome --version
          npm run verify:browser
      - name: Upload public guest browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrelmesh-browser-acceptance
          path: artifacts/browser/*-guest.png
          retention-days: 7
          if-no-files-found: ignore
